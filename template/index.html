<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#7c2d12" />
  <title>游目窗 · 可部署模板</title>
  <style>
    :root{--paper:#f2eadc;--ink:#17384a;--red:#7c2d12;--gold:#b89252;--sea:#6f9aa0;--deep:#0f2e3a;--line:#c9bda7;--shadow:#142f3d25}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#fffaf0 0,transparent 36%),var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif SC","Songti SC",serif;min-height:100vh}
    button{font:inherit}.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:30px 0 56px}.mast{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.mast h1{font-size:clamp(28px,4vw,48px);margin:0;letter-spacing:.08em}.mast p{margin:7px 0 0;color:#52656b}.badge{font:700 11px system-ui;letter-spacing:.12em;border:1px solid var(--red);color:var(--red);padding:7px 9px}
    .machine{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);background:#8d3e2d;border:4px solid #5e291e;border-radius:18px;padding:16px;box-shadow:14px 18px 0 var(--shadow),inset 0 0 0 2px #c66b50;gap:15px}.panel{background:#ead8b4;border:2px solid var(--gold);padding:14px;min-width:0}.panel h2{font:700 13px system-ui;letter-spacing:.14em;margin:0 0 10px}.map{position:relative;height:460px;overflow:hidden;border:7px solid var(--ink);background:linear-gradient(#ffffff25 1px,transparent 1px),linear-gradient(90deg,#ffffff25 1px,transparent 1px),#7aa2aa;background-size:42px 42px;box-shadow:inset 0 0 0 2px #eae5d7}.map::before,.map::after{content:"";position:absolute;border:2px solid #f4eddf80;border-radius:50%;inset:70px 35px;transform:rotate(-13deg)}.map::after{inset:150px 100px 80px 90px;transform:rotate(20deg)}.pin{position:absolute;width:17px;height:17px;border-radius:50%;border:3px solid #f6e9d5;background:var(--red);box-shadow:0 0 0 7px #7c2d1260;transform:translate(-50%,-50%);cursor:pointer;z-index:2}.pin.active{box-shadow:0 0 0 9px #f1c36b80,0 0 0 14px #7c2d1260}.screen{margin-top:12px;background:var(--deep);border:3px solid var(--gold);padding:14px;color:#e9e7d5;min-height:84px;font:600 12px ui-monospace,monospace;letter-spacing:.08em;line-height:1.6}.controls{display:flex;gap:10px;margin-top:12px}.release{flex:1;background:#d7b86c;border:4px outset #a57b31;padding:14px 16px;font:800 13px system-ui;letter-spacing:.13em;color:#283c3c;cursor:pointer}.release:active{border-style:inset}.slot{height:9px;background:#112f3b;border:2px solid var(--gold);border-radius:12px;margin:13px 18% 3px}
    .letter-stage{display:grid;place-items:center;min-height:100%;background:linear-gradient(135deg,#f5e7ca,#dac19a);border:2px solid #bca477;padding:20px}.postcard{width:min(370px,100%);aspect-ratio:736/1040;position:relative;perspective:1200px}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s}.postcard.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#efe1c6;clip-path:polygon(6% 0,10% 2%,14% 0,18% 2%,22% 0,26% 2%,30% 0,34% 2%,38% 0,42% 2%,46% 0,50% 2%,54% 0,58% 2%,62% 0,66% 2%,70% 0,74% 2%,78% 0,82% 2%,86% 0,90% 2%,94% 0,100% 6%,98% 10%,100% 14%,98% 18%,100% 22%,98% 26%,100% 30%,98% 34%,100% 38%,98% 42%,100% 46%,98% 50%,100% 54%,98% 58%,100% 62%,98% 66%,100% 70%,98% 74%,100% 78%,98% 82%,100% 86%,98% 90%,100% 94%,94% 100%,90% 98%,86% 100%,82% 98%,78% 100%,74% 98%,70% 100%,66% 98%,62% 100%,58% 98%,54% 100%,50% 98%,46% 100%,42% 98%,38% 100%,34% 98%,30% 100%,26% 98%,22% 100%,18% 98%,14% 100%,10% 98%,6% 100%,0 94%,2% 90%,0 86%,2% 82%,0 78%,2% 74%,0 70%,2% 66%,0 62%,2% 58%,0 54%,2% 50%,0 46%,2% 42%,0 38%,2% 34%,0 30%,2% 26%,0 22%,2% 18%,0 14%,2% 10%,0 6%);box-shadow:0 12px 24px #3c291f25}.back{transform:rotateY(180deg);padding:44px 36px;color:#49372d;background:linear-gradient(#00000006 1px,transparent 1px),#eadac0;background-size:100% 28px}.front{padding:38px 30px;display:flex;flex-direction:column}.stamp-head{display:flex;justify-content:space-between;font:800 11px system-ui;letter-spacing:.1em}.art{margin:22px 0 15px;flex:1;border:5px solid #e8d7b7;box-shadow:inset 0 0 0 1px #7c2d12;background:linear-gradient(145deg,var(--c1),var(--c2) 55%,var(--c3));position:relative;overflow:hidden}.art::before{content:"";position:absolute;width:78%;height:45%;left:-12%;top:16%;border-radius:50%;border:5px solid #fff9;transform:rotate(-15deg)}.art::after{content:"";position:absolute;width:54%;height:54%;right:-5%;bottom:-9%;background:#243f4b55;border-radius:48% 52% 12% 0;transform:rotate(-10deg)}.stamp-title{text-align:center}.stamp-title strong{display:block;font-size:27px;letter-spacing:.14em}.stamp-title span{font:700 11px system-ui;letter-spacing:.15em}.back .postmark{font:800 11px system-ui;letter-spacing:.14em;color:var(--red);margin-bottom:32px}.back .note{white-space:pre-line;font-size:18px;line-height:2.05}.back .sign{margin-top:36px;text-align:right}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button{border:1px solid var(--ink);background:#f8edda;padding:9px 12px;font:700 11px system-ui;cursor:pointer}.actions button.primary{background:var(--ink);color:#fff}.status{margin-top:12px;font:700 11px system-ui;color:#5c5c51}.archive{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.archive h3{font:800 11px system-ui;letter-spacing:.12em;margin:0 0 9px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{font:700 10px system-ui;padding:6px 8px;border:1px solid #a68f69;background:#f1e5cf}.help{margin-top:18px;font-size:13px;color:#56676c;line-height:1.7}
    @media(max-width:840px){.machine{grid-template-columns:1fr}.map{height:330px}.mast{align-items:flex-start;flex-direction:column}.letter-stage{min-height:560px}}@media(max-width:480px){.page{width:min(100% - 16px,1180px);padding-top:14px}.machine{padding:9px;border-width:3px}.panel{padding:9px}.map{height:280px}.back{padding:38px 29px}.back .note{font-size:16px}.letter-stage{padding:10px;min-height:520px}}
  </style>
</head>
<body>
<div class="page">
  <div class="mast"><div><h1 id="site-title">游目窗</h1><p id="subtitle"></p></div><span class="badge">DEPLOYABLE TEMPLATE · STATIC</span></div>
  <div class="machine">
    <section class="panel"><h2>WORLD LETTER MAP</h2><div class="map" id="map"></div><div class="screen" id="screen"></div><div class="controls"><button class="release" id="release">RELEASE · 出票</button></div><div class="slot"></div><div class="archive"><h3>藏信 / ARCHIVE</h3><div class="chips" id="archive"></div></div><p class="help">部署后修改 <code>config.js</code> 和 <code>letters.js</code> 就能换成自己的标题、收信人和来信。这个模板没有后台、密钥和私人数据。</p></section>
    <section class="letter-stage"><div style="width:100%"><div class="postcard" id="postcard"><div class="inner"><article class="face front" id="front"><div class="stamp-head"><span>YOMÉMADO</span><span id="stamp-id"></span></div><div class="art" id="art"></div><div class="stamp-title"><strong id="stamp-title"></strong><span id="stamp-subtitle"></span></div></article><article class="face back"><div class="postmark" id="postmark"></div><div class="note" id="note"></div><div class="sign" id="sign"></div></article></div></div><div class="actions"><button class="primary" id="flip">翻面 / FLIP</button><button id="download">存图 / PNG</button><button id="collect">入藏 / COLLECT</button></div><div class="status" id="status"></div></div></section>
  </div>
</div>
<script src="./config.js"></script><script src="./letters.js"></script>
<script>
(() => {
  const cfg = window.YOMEMADO_CONFIG || {};
  const letters = Array.isArray(window.YOMEMADO_LETTERS) ? window.YOMEMADO_LETTERS : [];
  const $ = id => document.getElementById(id);
  const key = 'yomemado-template-collected-v1';
  const initial = Array.isArray(cfg.initialCollectedIds) ? cfg.initialCollectedIds : [];
  let collected = new Set(JSON.parse(localStorage.getItem(key) || JSON.stringify(initial)));
  let selected = Math.max(0, letters.length - 1);
  $('site-title').textContent = cfg.siteTitle || '我的游目窗'; $('subtitle').textContent = cfg.subtitle || '';
  function mapXY(lat, lon){ return [((lon + 180) / 360) * 100, ((90 - lat) / 180) * 100] }
  function renderMap(){ $('map').innerHTML=''; letters.forEach((l,i)=>{ const [x,y]=mapXY(Number(l.latitude)||0,Number(l.longitude)||0); const b=document.createElement('button'); b.className='pin'+(i===selected?' active':''); b.style.left=x+'%'; b.style.top=y+'%'; b.title=`${l.id} · ${l.place}`; b.setAttribute('aria-label',b.title); b.onclick=()=>select(i); $('map').appendChild(b) }) }
  function select(i){ selected=i; const l=letters[i]; $('screen').innerHTML=`INCOMING · ${l.id}<br>${l.place}, ${l.region}<br>${Number(l.latitude).toFixed(2)} / ${Number(l.longitude).toFixed(2)}`; renderMap(); updateStatus() }
  function issue(){ if(!letters.length)return; const l=letters[selected]; $('stamp-id').textContent='NO. '+l.id; $('stamp-title').textContent=l.title; $('stamp-subtitle').textContent=l.subtitle; $('postmark').textContent=`POSTCARD · ${l.date} · ${l.place}`; $('note').textContent=l.note; $('sign').textContent=`—— ${cfg.receiverName ? '寄给 '+cfg.receiverName : '游目窗'}`; const p=l.palette||['#294a61','#b89252','#efe2c7']; $('art').style.setProperty('--c1',p[0]); $('art').style.setProperty('--c2',p[1]); $('art').style.setProperty('--c3',p[2]); $('postcard').classList.remove('flipped'); updateStatus() }
  function updateStatus(){ const l=letters[selected]; $('collect').disabled=!l; $('collect').textContent=l&&collected.has(l.id)?'已入藏 / COLLECTED':'入藏 / COLLECT'; $('status').textContent=`RECEIVED ${String(letters.length).padStart(2,'0')} · COLLECTED ${String(collected.size).padStart(2,'0')}`; $('archive').innerHTML=''; [...letters].filter(l=>collected.has(l.id)).reverse().forEach(l=>{const s=document.createElement('span');s.className='chip';s.textContent=`${l.id} · ${l.title}`;$('archive').appendChild(s)}) }
  function save(){ localStorage.setItem(key, JSON.stringify([...collected])); updateStatus() }
  function drawSide(side,l){ const c=document.createElement('canvas'); c.width=736;c.height=1040;const x=c.getContext('2d'); x.fillStyle='#efe1c6';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#7c2d12';x.lineWidth=8;x.strokeRect(32,32,672,976); x.fillStyle='#17384a';x.font='bold 26px serif';x.fillText(`YOMÉMADO · ${l.id}`,62,90); if(side==='front'){ const g=x.createLinearGradient(70,150,660,810);const p=l.palette||['#294a61','#b89252','#efe2c7'];p.forEach((v,i)=>g.addColorStop(i/(p.length-1),v));x.fillStyle=g;x.fillRect(70,145,596,690);x.fillStyle='#17384a';x.font='bold 46px serif';x.textAlign='center';x.fillText(l.title,368,900);x.font='bold 22px sans-serif';x.fillText(l.subtitle,368,944) } else {x.fillStyle='#49372d';x.font='28px serif';x.textAlign='left';const lines=(l.note||'').split('\n');lines.forEach((t,i)=>x.fillText(t,75,270+i*70));x.font='bold 22px sans-serif';x.fillText(`${l.date} · ${l.place}`,75,155)} return c }
  function downloadCanvas(c,name){ const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click() }
  $('release').onclick=issue; $('flip').onclick=()=>{$('postcard').classList.toggle('flipped')}; $('collect').onclick=()=>{const l=letters[selected];if(!l)return; collected.add(l.id);save()}; $('download').onclick=()=>{const l=letters[selected];if(!l)return;downloadCanvas(drawSide('front',l),`${cfg.downloadPrefix||'yomemado'}-${l.id}-front.png`);setTimeout(()=>downloadCanvas(drawSide('back',l),`${cfg.downloadPrefix||'yomemado'}-${l.id}-back.png`),120)};
  if(letters.length){select(selected);issue()} else {$('screen').textContent='NO LETTERS';updateStatus()}
})();
</script>
</body></html>
